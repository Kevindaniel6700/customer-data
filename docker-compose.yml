version: "3.8"

services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Flask mock server
  mock-server:
    build: ./mock-server
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # FastAPI pipeline service
  pipeline-service:
    build: ./pipeline-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MOCK_SERVER_URL: http://mock-server:5000
    depends_on:
      postgres:
        condition: service_healthy
      mock-server:
        condition: service_started

volumes:
  pgdata:
